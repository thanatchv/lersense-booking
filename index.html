<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Lersense Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    // 🔴 1. นำ API Key และ URL จาก Supabase มาใส่ตรงนี้ 🔴
    const SUPABASE_URL = 'https://fbbyvdejhivrdedggtkt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYnl2ZGVqaGl2cmRlZGdndGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjYxMjIsImV4cCI6MjA5NjYwMjEyMn0.27i1ZEBIkpYsCAwTakNpjSmP4dRO9l53wSG5xSnRyfA';

    const isConfigured = !SUPABASE_URL.includes('วาง_');
    const supabaseClient = isConfigured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const Icon = ({ name, className }) => <i data-lucide={name} className={className}></i>;

    function App() {
      const [step, setStep] = useState('LOGIN'); 
      const [loading, setLoading] = useState(false);
      const [modal, setModal] = useState({ isOpen: false, title: '', message: '' });
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [dbError, setDbError] = useState(false);

      const [servicesData, setServicesData] = useState([]);
      const [branchesData, setBranchesData] = useState([]);
      const [userProfile, setUserProfile] = useState(null);
      const [lineProfile, setLineProfile] = useState(null);

      const [formData, setFormData] = useState({
        firstName: '', lastName: '', email: '', phone: '', dob: '', address: '',
        serviceId: '', locationId: '', staffId: 'random', pax: '1', date: '', time: '',
        healthRisks: { pregnant: false, highBp: false, surgery: false },
        equipments: { mat: false, towel: false },
        pdpaConsent: false
      });

      const [endTime, setEndTime] = useState('ยังไม่ได้เลือก');
      const [bookingRef, setBookingRef] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('promptpay');
      
      const today = new Date().toISOString().split('T')[0];

      // โหลดไอคอน
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      // ดึงข้อมูลและตรวจสอบสถานะล็อกอินตอนเปิดเว็บ
      useEffect(() => {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);
        fetchSupabaseData();

        // 🟡 [เพิ่มใหม่] ตรวจสอบว่าเคยล็อกอินค้างไว้หรือไม่
        if (supabaseClient) {
          supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) handleSession(session);
          });

          // ดักจับเหตุการณ์เวลาล็อกอินสำเร็จ
          const { data: { subscription } } = supabaseClient.auth.onAuthStateChange((_event, session) => {
            if (session) handleSession(session);
          });

          return () => subscription.unsubscribe();
        }
      }, []);

      const toggleTheme = () => setIsDarkMode(!isDarkMode);

      // 🟡 [เพิ่มใหม่] ฟังก์ชันจัดการหลังจากล็อกอินผ่าน LINE สำเร็จ
      const handleSession = async (session) => {
        setLoading(true);
        const user = session.user;

        try {
          // เช็คว่ามีข้อมูลในตาราง profiles หรือยัง (เคยสมัครสมาชิกไหม)
          const { data: profile, error } = await supabaseClient
            .from('profiles')
            .select('*')
            .eq('id', user.id)
            .maybeSingle();

          if (profile) {
            // เคยสมัครแล้ว -> ข้ามไปหน้าจองคิวเลย
            setUserProfile({ 
              id: profile.id, 
              name: `${profile.first_name} ${profile.last_name}`, 
              phone: profile.phone, 
              tier: profile.tier 
            });
            setStep('BOOKING');
          } else {
            // ยังไม่เคยสมัคร -> ดึงชื่อและรูปจาก LINE มาแสดงในหน้าสมัคร
            const metadata = user.user_metadata || {};
            setLineProfile({
              displayName: metadata.full_name || metadata.name || 'ผู้ใช้ LINE',
              pictureUrl: metadata.avatar_url || 'https://ui-avatars.com/api/?name=User&background=00c300&color=fff'
            });
            
            // แยกชื่อ-นามสกุลจาก LINE มาใส่ให้ก่อนถ้ามี
            const nameParts = (metadata.full_name || metadata.name || '').split(' ');
            setFormData(prev => ({ 
              ...prev, 
              firstName: nameParts[0] || '', 
              lastName: nameParts[1] || '' 
            }));
            
            setStep('REGISTER');
          }
        } catch (err) {
          console.error("Session Error:", err);
        }
        setLoading(false);
      };

      const fetchSupabaseData = async () => {
        if (!supabaseClient) {
          setServicesData([
            { id: 'S1', name: '[จำลอง] นวดไทย', duration_minutes: 60, price: 500, deposit_amount: 200 },
            { id: 'S2', name: '[จำลอง] นวดอโรม่า', duration_minutes: 90, price: 1200, deposit_amount: 500 }
          ]);
          setBranchesData([
            { id: 'L1', name: '[จำลอง] สาขาหลัก', type: 'in_store' },
            { id: 'L2', name: '[จำลอง] นอกสถานที่', type: 'off_site' }
          ]);
          return;
        }

        try {
          const { data: sData, error: sError } = await supabaseClient.from('services').select('*').eq('is_active', true);
          const { data: bData, error: bError } = await supabaseClient.from('branches').select('*').eq('is_active', true);
          
          if (sError || bError) throw (sError || bError);
          
          if (sData && sData.length > 0) {
            setServicesData(sData);
            setDbError(false);
          } else {
            setDbError(true); 
          }
          if (bData && bData.length > 0) setBranchesData(bData);
        } catch (err) {
          console.error("Fetch Error: ", err);
          setDbError(true);
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        if (name.startsWith('health_')) {
          const key = name.replace('health_', '');
          setFormData(prev => ({ ...prev, healthRisks: { ...prev.healthRisks, [key]: checked } }));
        } else if (name.startsWith('equip_')) {
          const key = name.replace('equip_', '');
          setFormData(prev => ({ ...prev, equipments: { ...prev.equipments, [key]: checked } }));
        } else if (type === 'checkbox') {
          setFormData(prev => ({ ...prev, [name]: checked }));
        } else {
          setFormData(prev => ({ ...prev, [name]: value }));
        }
      };

      useEffect(() => {
        if (formData.serviceId && formData.time && servicesData.length > 0) {
          const service = servicesData.find(s => s.id === formData.serviceId);
          if (service) {
            const [hours, minutes] = formData.time.split(':').map(Number);
            const dateObj = new Date();
            dateObj.setHours(hours, minutes + service.duration_minutes);
            const endH = String(dateObj.getHours()).padStart(2, '0');
            const endM = String(dateObj.getMinutes()).padStart(2, '0');
            setEndTime(`${service.duration_minutes} นาที • เสร็จประมาณ ${endH}:${endM}`);
          }
        } else {
          setEndTime('ยังไม่ได้เลือก');
        }
      }, [formData.serviceId, formData.time, servicesData]);

      // 🟡 [แก้ไขใหม่] ปุ่มกดเข้าสู่ระบบผ่าน LINE
      const handleLineLogin = async () => {
        if (!supabaseClient) {
          // โหมดจำลองเหมือนเดิม ถ้ายังไม่ตั้งค่า Supabase
          setLoading(true);
          setTimeout(() => {
            setLoading(false);
            setLineProfile({ displayName: 'สมหญิง รักสปา', pictureUrl: 'https://ui-avatars.com/api/?name=Somying+R&background=00c300&color=fff&size=150' });
            setFormData(prev => ({ ...prev, firstName: 'สมหญิง', lastName: 'รักสปา' }));
            setStep('REGISTER');
          }, 800);
          return;
        }

        // เชื่อมต่อระบบ Auth ของ Supabase (เปิดหน้าต่างล็อกอินของ LINE)
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'line',
          options: {
            redirectTo: window.location.origin // ล็อกอินเสร็จให้เด้งกลับมาหน้านี้
          }
        });

        if (error) {
          setModal({ isOpen: true, title: 'ล็อกอินล้มเหลว', message: error.message });
        }
      };

      // 🟡 [แก้ไขใหม่] การบันทึกข้อมูลสมัครสมาชิกให้ผูกกับบัญชีที่ล็อกอิน
      const handleRegister = async (e) => {
        e.preventDefault();
        setLoading(true);
        let currentUserId = 'MOCK_USER_ID';

        if (supabaseClient) {
          try {
            // ดึง ID ของคนที่เพิ่งล็อกอินเข้ามา
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) throw new Error('ไม่พบข้อมูลการล็อกอิน');
            
            currentUserId = session.user.id;

            const { error } = await supabaseClient.from('profiles').insert([{
              id: currentUserId, // 📌 ผูกไอดีกับ Auth อัตโนมัติ
              first_name: formData.firstName,
              last_name: formData.lastName,
              email: formData.email,
              phone: formData.phone,
              dob: formData.dob,
              address: formData.address,
              pdpa_consented: formData.pdpaConsent,
              tier: 'Classic'
            }]);
            
            if (error) throw error;
          } catch (err) {
            console.error("Register Error:", err);
            setModal({ isOpen: true, title: 'ข้อผิดพลาด', message: 'ไม่สามารถสมัครสมาชิกได้: ' + err.message });
            setLoading(false);
            return;
          }
        }

        setTimeout(() => {
          setLoading(false);
          setStep('PAYMENT');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 800);
      };

      const handlePaymentSuccess = async () => {
        setLoading(true);
        if (supabaseClient) {
          try {
            const selectedService = servicesData.find(s => s.id === formData.serviceId) || {};
            const depositAmount = (selectedService.deposit_amount || 200) * parseInt(formData.pax);

            const { error } = await supabaseClient
              .from('bookings')
              .update({ status: 'confirmed', deposit_paid: depositAmount, payment_status: 'deposit_paid' })
              .eq('booking_ref', bookingRef);
            if (error) throw error;
          } catch (err) {
            console.error("Update Payment Error:", err);
          }
        }
        setTimeout(() => {
          setLoading(false);
          setStep('TICKET');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 1500);
      };

      const selectedServiceObj = servicesData.find(s => s.id === formData.serviceId) || {};
      const paxCount = parseInt(formData.pax) || 1;
      const depositTotal = (selectedServiceObj.deposit_amount || 200) * paxCount;

      return (
        <div className={`min-h-screen pb-32 transition-colors duration-500 app-container ${isDarkMode ? 'dark' : 'light'}`}>
          <style>{`
            .app-container { font-family: 'Noto Sans Thai', sans-serif; color-scheme: light; --bg-gradient: radial-gradient(circle at 10% 20%, rgba(183, 148, 244, 0.35), transparent 30%), radial-gradient(circle at 90% 15%, rgba(216, 179, 106, 0.18), transparent 28%), radial-gradient(circle at 85% 85%, rgba(159, 122, 234, 0.20), transparent 25%), linear-gradient(180deg, #f8f5fc 0%, #f3edf9 45%, #efe8f6 100%); --text-main: #1f2937; --text-muted: #4b5563; --text-heading: #4c1d95; --bg-glass: linear-gradient(180deg, rgba(255,255,255,0.66), rgba(255,255,255,0.42)); --border-glass: rgba(255, 255, 255, 0.42); --bg-input: rgba(255,255,255,0.42); --border-input: rgba(255, 255, 255, 0.45); --bg-input-focus: rgba(255,255,255,0.60); --bg-element: rgba(255,255,255,0.3); }
            .app-container.dark { color-scheme: dark; --bg-gradient: radial-gradient(circle at 10% 20%, rgba(139, 92, 246, 0.15), transparent 30%), radial-gradient(circle at 90% 15%, rgba(216, 179, 106, 0.1), transparent 28%), radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.1), transparent 25%), linear-gradient(180deg, #1e1528 0%, #160f1d 45%, #0f0a14 100%); --text-main: #f3f4f6; --text-muted: #9ca3af; --text-heading: #d8b4fe; --bg-glass: linear-gradient(180deg, rgba(40, 25, 60, 0.45), rgba(20, 10, 30, 0.6)); --border-glass: rgba(255, 255, 255, 0.08); --bg-input: rgba(0, 0, 0, 0.25); --border-input: rgba(255, 255, 255, 0.05); --bg-input-focus: rgba(0,0,0,0.4); --bg-element: rgba(255,255,255,0.05); }
            .app-container { background: var(--bg-gradient); color: var(--text-main); }
            .glass-panel { background: var(--bg-glass); border: 1px solid var(--border-glass); box-shadow: 0 18px 50px rgba(0,0,0,0.1); backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%); transition: all 0.3s ease; }
            .input-shell { background: var(--bg-input); border: 1px solid var(--border-input); box-shadow: inset 0 1px 0 var(--border-glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: 0.22s ease; }
            .input-shell:focus-within { transform: translateY(-1px); border-color: rgba(159,122,234,0.45); box-shadow: 0 0 0 4px rgba(159,122,234,0.15), inset 0 1px 0 var(--border-glass); background: var(--bg-input-focus); }
            .form-element { width: 100%; background: transparent; border: none; outline: none; padding: 14px; min-height: 52px; color: var(--text-main); font-size: 0.96rem; }
            select.form-element { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #9ca3af 50%), linear-gradient(135deg, #9ca3af 50%, transparent 50%); background-position: calc(100% - 18px) calc(50% - 3px), calc(100% - 12px) calc(50% - 3px); background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; padding-right: 36px; }
            select.form-element option { background: ${isDarkMode ? '#1f2937' : '#ffffff'}; color: ${isDarkMode ? '#f3f4f6' : '#1f2937'}; }
            .btn-gold { background: linear-gradient(180deg, rgba(255,255,255,0.22), rgba(255,255,255,0.02)), linear-gradient(135deg, #d6b067 0%, #bf8d39 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 24px rgba(191, 141, 57, 0.32); transition: transform .18s ease; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }
            .btn-gold:active { transform: translateY(1px) scale(0.995); }
            .btn-line { background: linear-gradient(180deg, #10d061 0%, #06b755 100%); border: 1px solid rgba(6,199,85,0.18); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 10px 24px rgba(6,183,85,0.24); transition: transform .18s ease; }
            ::-webkit-calendar-picker-indicator { filter: ${isDarkMode ? 'invert(1)' : 'invert(0)'}; }
            
            .ticket-cutout { position: relative; }
            .ticket-cutout::before, .ticket-cutout::after { content: ''; position: absolute; top: -12px; width: 24px; height: 24px; background: var(--bg-gradient); border-radius: 50%; border: 1px solid var(--border-glass); z-index: 10; }
            .ticket-cutout::before { left: -12px; border-right-color: transparent; border-top-color: transparent; transform: rotate(45deg); }
            .ticket-cutout::after { right: -12px; border-left-color: transparent; border-top-color: transparent; transform: rotate(-45deg); }
          `}</style>

          {/* Modal Overlay */}
          {(loading || modal.isOpen) && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-md">
              {loading ? (
                <div className="glass-panel p-6 rounded-3xl flex flex-col items-center">
                  <div className="w-10 h-10 border-4 border-purple-200 border-t-purple-600 rounded-full animate-spin"></div>
                  <p className="mt-4 font-medium" style={{ color: 'var(--text-main)' }}>กำลังดำเนินการ...</p>
                </div>
              ) : (
                <div className="glass-panel p-6 rounded-3xl max-w-sm w-full text-center">
                  <Icon name="alert-triangle" className="w-12 h-12 text-yellow-500 mx-auto mb-4" />
                  <h3 className="text-xl font-bold mb-2" style={{ color: 'var(--text-main)' }}>{modal.title}</h3>
                  <p className="text-sm mb-6" style={{ color: 'var(--text-muted)' }}>{modal.message}</p>
                  <button onClick={() => setModal({ isOpen: false, title: '', message: '' })} className="w-full btn-gold py-3 rounded-2xl text-white font-semibold">ตกลง</button>
                </div>
              )}
            </div>
          )}

          {/* Topbar */}
          <div className="fixed top-0 left-0 right-0 z-40 h-28 pointer-events-none transition-colors duration-500" 
               style={{ backdropFilter: 'blur(20px)', WebkitBackdropFilter: 'blur(20px)', maskImage: 'linear-gradient(to bottom, black 30%, transparent 100%)', WebkitMaskImage: 'linear-gradient(to bottom, black 30%, transparent 100%)', background: isDarkMode ? 'linear-gradient(to bottom, rgba(30, 21, 40, 0.9) 0%, rgba(30, 21, 40, 0) 100%)' : 'linear-gradient(to bottom, rgba(248, 245, 252, 0.95) 0%, rgba(248, 245, 252, 0) 100%)' }}></div>
          <div className="fixed top-0 left-0 right-0 z-50 px-4 pt-4 pb-2">
            <div className="max-w-lg mx-auto flex items-center justify-between">
              <div className="flex items-center gap-3 pl-1">
                <div className="w-10 h-10 rounded-[16px] bg-gradient-to-br from-purple-500 to-yellow-600 p-[1px] shadow-sm relative overflow-hidden flex-shrink-0">
                   <div className="absolute inset-0 bg-gradient-to-b from-white/60 to-transparent"></div>
                   <div className="w-full h-full bg-gradient-to-br from-purple-400 to-yellow-500 rounded-[15px] flex items-center justify-center text-white font-bold text-lg shadow-inner">L</div>
                </div>
                <div className="flex flex-col justify-center drop-shadow-sm">
                  <h1 className="font-bold text-[16px] leading-tight tracking-wide" style={{ color: 'var(--text-main)' }}>Lersense Spa</h1>
                  <p className="text-[10px] uppercase tracking-widest font-semibold mt-0.5" style={{ color: 'var(--text-heading)', opacity: 0.9 }}>Enterprise</p>
                </div>
              </div>
              <button onClick={toggleTheme} className="w-10 h-10 rounded-full flex items-center justify-center shadow-sm backdrop-blur-md" style={{ background: isDarkMode ? 'rgba(255,255,255,0.05)' : 'rgba(255,255,255,0.6)', border: '1px solid var(--border-glass)' }}>
                <Icon name={isDarkMode ? 'sun' : 'moon'} className={`w-5 h-5 ${isDarkMode ? 'text-yellow-400' : 'text-purple-700'}`} />
              </button>
            </div>
          </div>

          {/* Main Content */}
          <div className="max-w-lg mx-auto px-4 pt-24 relative z-30">
            
            {step === 'LOGIN' && (
              <div className="animate-fade-in flex flex-col items-center justify-center pt-10 pb-8 text-center">
                <div className="w-24 h-24 rounded-3xl bg-gradient-to-br from-purple-500 to-yellow-600 p-[2px] shadow-xl mb-8">
                   <div className="w-full h-full bg-gradient-to-br from-purple-400 to-yellow-500 rounded-[22px] flex items-center justify-center text-white font-bold text-5xl">L</div>
                </div>
                <h2 className="text-2xl font-bold mb-3" style={{ color: 'var(--text-main)' }}>ยินดีต้อนรับสู่ Lersense</h2>
                <p className="text-sm mb-8 px-4" style={{ color: 'var(--text-muted)' }}>กรุณาเข้าสู่ระบบเพื่อดำเนินการจองคิว และสะสมคะแนนสมาชิก</p>
                <div className="w-full max-w-sm glass-panel p-6 rounded-3xl">
                  <button onClick={handleLineLogin} className="w-full btn-line py-4 rounded-2xl text-white font-bold flex items-center justify-center gap-2 text-lg">
                    <Icon name="message-circle" className="w-6 h-6" /> เข้าสู่ระบบด้วย LINE
                  </button>
                </div>
              </div>
            )}

            {step === 'REGISTER' && (
              <div className="animate-fade-in">
                <div className="mb-6 px-2 text-center">
                  <h2 className="text-2xl font-bold mb-2" style={{ color: 'var(--text-main)' }}>ลงทะเบียนสมาชิก</h2>
                  <p className="text-sm" style={{ color: 'var(--text-muted)' }}>กรุณากรอกข้อมูลที่จำเป็นเพื่อเชื่อมต่อกับบัญชีของท่าน</p>
                </div>
                <form onSubmit={handleRegister} className="glass-panel rounded-[28px] overflow-hidden p-6">
                  <div className="flex flex-col gap-5">
                    <div className="grid grid-cols-2 gap-4">
                      <div className="flex flex-col gap-1.5"><label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>ชื่อ</label><div className="input-shell rounded-2xl flex items-center pl-3"><input type="text" name="firstName" required className="form-element px-2" value={formData.firstName} onChange={handleChange} /></div></div>
                      <div className="flex flex-col gap-1.5"><label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>นามสกุล</label><div className="input-shell rounded-2xl flex items-center pl-3"><input type="text" name="lastName" required className="form-element px-2" value={formData.lastName} onChange={handleChange} /></div></div>
                    </div>
                    
                    <div className="flex flex-col gap-1.5">
                      <label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>อีเมล</label>
                      <div className="input-shell rounded-2xl flex items-center pl-3">
                        <Icon name="mail" className="w-5 h-5 opacity-50" style={{ color: 'var(--text-main)' }} />
                        <input type="email" name="email" required className="form-element pl-2" value={formData.email} onChange={handleChange} />
                      </div>
                    </div>
                    
                    <div className="grid grid-cols-2 gap-4">
                      <div className="flex flex-col gap-1.5">
                        <label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>เบอร์โทรศัพท์</label>
                        <div className="input-shell rounded-2xl flex items-center pl-3">
                          <Icon name="phone" className="w-5 h-5 opacity-50" style={{ color: 'var(--text-main)' }} />
                          <input type="tel" name="phone" required pattern="[0-9]{10}" className="form-element pl-2" value={formData.phone} onChange={handleChange} />
                        </div>
                      </div>
                      <div className="flex flex-col gap-1.5">
                        <label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>วันเกิด</label>
                        <div className="input-shell rounded-2xl flex items-center pr-3">
                          <input type="date" name="dob" required className="form-element px-2 w-full" value={formData.dob} onChange={handleChange} />
                        </div>
                      </div>
                    </div>

                    {/* เพิ่มช่องกรอกที่อยู่ */}
                    <div className="flex flex-col gap-1.5">
                      <label className="text-sm pl-1 font-medium" style={{ color: 'var(--text-heading)' }}>ที่อยู่</label>
                      <div className="input-shell rounded-2xl flex items-start pl-3 pt-3">
                        <Icon name="home" className="w-5 h-5 opacity-50 mt-1" style={{ color: 'var(--text-main)' }} />
                        <textarea name="address" required placeholder="บ้านเลขที่, ถนน, ซอย, จังหวัด, รหัสไปรษณีย์..."
                          className="bg-transparent border-none outline-none text-sm w-full resize-none min-h-[80px] px-2" 
                          value={formData.address} onChange={handleChange} style={{ color: 'var(--text-main)' }}></textarea>
                      </div>
                    </div>

                    {/* เพิ่มช่องยินยอม PDPA */}
                    <div className="mt-2 p-4 rounded-2xl" style={{ background: 'var(--bg-element)', border: '1px solid var(--border-glass)' }}>
                      <label className="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" name="pdpaConsent" required checked={formData.pdpaConsent} onChange={handleChange} className="w-5 h-5 accent-purple-600 rounded mt-0.5" />
                        <div className="text-xs" style={{ color: 'var(--text-muted)' }}>
                          <strong style={{ color: 'var(--text-main)' }}>การให้ความยินยอม (PDPA)</strong><br/>
                          ข้าพเจ้ายินยอมให้เก็บรวบรวมและใช้ข้อมูลส่วนบุคคล เพื่อวัตถุประสงค์ในการจองคิวและให้บริการ
                        </div>
                      </label>
                    </div>

                    <button type="submit" className="w-full btn-gold py-4 rounded-2xl text-white font-bold text-lg mt-2">ยืนยันการสมัคร</button>
                  </div>
                </form>
              </div>
            )}

            {step === 'BOOKING' && (
              <div className="animate-fade-in">
                <div className="mb-6 px-2">
                  <h2 className="text-3xl font-bold leading-tight tracking-tight mb-2" style={{ color: 'var(--text-main)' }}>เลือกบริการ นัดเวลา<br/>จองได้ในไม่กี่ขั้นตอน</h2>
                </div>
                
                {isConfigured && dbError && (
                  <div className="mb-6 p-4 bg-red-50 text-red-700 rounded-2xl text-sm border border-red-200">
                    <strong className="block mb-1"><Icon name="alert-circle" className="w-5 h-5 inline mr-1" /> ดึงข้อมูลจากฐานข้อมูลไม่ได้!</strong>
                    โปรดรันโค้ด SQL เพื่ออนุญาตการอ่านข้อมูล (แก้ปัญหา RLS) ในเมนู SQL Editor ของ Supabase
                  </div>
                )}

                <form onSubmit={handleBookingSubmit} className="glass-panel rounded-[28px] overflow-hidden mb-8">
                  <div className="p-5 border-b relative z-10" style={{ borderColor: 'var(--border-glass)' }}>
                    <h3 className="font-semibold mb-4 flex items-center gap-2" style={{ color: 'var(--text-heading)' }}><Icon name="map-pin" className="w-5 h-5" /> รายละเอียดการจอง</h3>
                    <div className="flex flex-col gap-4">
                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs pl-1" style={{ color: 'var(--text-muted)' }}>บริการ</label>
                        <div className="input-shell rounded-2xl">
                          <select name="serviceId" required className="form-element" value={formData.serviceId} onChange={handleChange}>
                            <option value="" disabled>เลือกบริการ</option>
                            {servicesData.map(s => <option key={s.id} value={s.id}>{s.name} • {s.duration_minutes} นาที</option>)}
                          </select>
                        </div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div className="flex flex-col gap-1.5">
                          <label className="text-xs pl-1" style={{ color: 'var(--text-muted)' }}>สาขา</label>
                          <div className="input-shell rounded-2xl">
                            <select name="locationId" required className="form-element px-3" value={formData.locationId} onChange={handleChange}>
                              <option value="" disabled>เลือกสาขา</option>
                              {branchesData.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
                            </select>
                          </div>
                        </div>
                        <div className="flex flex-col gap-1.5">
                          <label className="text-xs pl-1" style={{ color: 'var(--text-muted)' }}>จำนวนคน</label>
                          <div className="input-shell rounded-2xl">
                            <select name="pax" required className="form-element px-3" value={formData.pax} onChange={handleChange}>
                              {[1,2,3,4].map(n => <option key={n} value={n}>{n} ท่าน</option>)}
                            </select>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="p-5 border-b relative z-10" style={{ borderColor: 'var(--border-glass)' }}>
                    <h3 className="font-semibold mb-4 flex items-center gap-2" style={{ color: 'var(--text-heading)' }}><Icon name="calendar" className="w-5 h-5" /> วันและเวลา</h3>
                    <div className="grid grid-cols-2 gap-4">
                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs pl-1" style={{ color: 'var(--text-muted)' }}>วันที่</label>
                        <div className="input-shell rounded-2xl"><input type="date" name="date" required min={today} className="form-element" value={formData.date} onChange={handleChange} /></div>
                      </div>
                      <div className="flex flex-col gap-1.5">
                        <label className="text-xs pl-1" style={{ color: 'var(--text-muted)' }}>เวลาเริ่ม</label>
                        <div className="input-shell rounded-2xl"><input type="time" name="time" required className="form-element" value={formData.time} onChange={handleChange} /></div>
                      </div>
                    </div>
                  </div>

                  <div className="p-5">
                    <button type="submit" className="w-full btn-gold py-4 rounded-[18px] text-white font-bold text-lg">ดำเนินการจองคิว</button>
                  </div>
                </form>
              </div>
            )}

            {/* PAYMENT STEP */}
            {step === 'PAYMENT' && (
              <div className="animate-fade-in">
                <div className="mb-6 px-2 text-center">
                  <h2 className="text-2xl font-bold mb-2" style={{ color: 'var(--text-main)' }}>ชำระเงินมัดจำ</h2>
                  <p className="text-sm" style={{ color: 'var(--text-muted)' }}>เพื่อยืนยันคิว รหัสการจอง: <span className="font-mono font-bold">{bookingRef}</span></p>
                </div>

                <div className="glass-panel rounded-[28px] p-6 mb-6 text-center">
                  <p className="text-sm mb-1" style={{ color: 'var(--text-muted)' }}>ยอดมัดจำที่ต้องชำระ (Hold 15 นาที)</p>
                  <h3 className="text-5xl font-bold mb-2" style={{ color: 'var(--text-heading)' }}>฿{depositTotal.toLocaleString()}</h3>
                  <p className="text-xs" style={{ color: 'var(--text-muted)' }}>({selectedServiceObj.name} x {formData.pax} ท่าน)</p>
                </div>

                <div className="glass-panel rounded-[28px] p-5 mb-8">
                  <h3 className="font-semibold mb-4 text-sm" style={{ color: 'var(--text-heading)' }}>เลือกช่องทางชำระเงิน</h3>
                  <div className="flex gap-3 mb-6">
                    <button onClick={() => setPaymentMethod('promptpay')} className={`flex-1 py-3 rounded-2xl flex flex-col items-center gap-2 border-2 transition-all ${paymentMethod === 'promptpay' ? 'border-purple-500 bg-purple-500/10' : 'border-transparent'}`} style={{ background: paymentMethod === 'promptpay' ? '' : 'var(--bg-input)' }}>
                      <Icon name="qr-code" className={`w-6 h-6 ${paymentMethod === 'promptpay' ? 'text-purple-600' : 'text-gray-400'}`} />
                      <span className={`text-xs font-bold ${paymentMethod === 'promptpay' ? 'text-purple-700' : 'text-gray-500'}`}>พร้อมเพย์ QR</span>
                    </button>
                    <button onClick={() => setPaymentMethod('creditcard')} className={`flex-1 py-3 rounded-2xl flex flex-col items-center gap-2 border-2 transition-all ${paymentMethod === 'creditcard' ? 'border-purple-500 bg-purple-500/10' : 'border-transparent'}`} style={{ background: paymentMethod === 'creditcard' ? '' : 'var(--bg-input)' }}>
                      <Icon name="credit-card" className={`w-6 h-6 ${paymentMethod === 'creditcard' ? 'text-purple-600' : 'text-gray-400'}`} />
                      <span className={`text-xs font-bold ${paymentMethod === 'creditcard' ? 'text-purple-700' : 'text-gray-500'}`}>บัตรเครดิต</span>
                    </button>
                  </div>

                  {paymentMethod === 'promptpay' && (
                    <div className="text-center animate-fade-in">
                      <div className="w-48 h-48 mx-auto bg-white p-2 rounded-2xl shadow-sm mb-4">
                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=PROMPTPAY_${bookingRef}&color=4c1d95`} alt="QR Code" className="w-full h-full object-contain opacity-90" />
                      </div>
                      <p className="text-xs text-red-500 font-semibold mb-4 animate-pulse">กรุณาสแกนภายใน 14:59 นาที</p>
                    </div>
                  )}

                  {paymentMethod === 'creditcard' && (
                    <div className="animate-fade-in flex flex-col gap-3 mb-4">
                      <div className="input-shell rounded-2xl flex items-center pl-3">
                        <Icon name="credit-card" className="w-5 h-5 opacity-50" style={{ color: 'var(--text-main)' }} />
                        <input type="text" placeholder="หมายเลขบัตรเครดิต" className="form-element pl-2" />
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="input-shell rounded-2xl flex items-center px-3"><input type="text" placeholder="MM/YY" className="form-element px-0" /></div>
                        <div className="input-shell rounded-2xl flex items-center px-3"><input type="text" placeholder="CVV" className="form-element px-0" /></div>
                      </div>
                    </div>
                  )}

                  <button onClick={handlePaymentSuccess} className="w-full btn-gold py-4 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2">
                    <Icon name="shield-check" className="w-5 h-5" /> {paymentMethod === 'promptpay' ? 'จำลอง: สแกนจ่ายสำเร็จ' : 'ชำระเงิน'}
                  </button>
                </div>
              </div>
            )}

            {/* TICKET STEP */}
            {step === 'TICKET' && (
              <div className="animate-fade-in flex flex-col items-center pt-4">
                <h2 className="text-2xl font-bold mb-6 text-green-600 flex items-center gap-2"><Icon name="check-circle" className="w-8 h-8" /> ชำระเงินสำเร็จ</h2>
                
                <div className="w-full max-w-sm glass-panel rounded-[32px] overflow-hidden shadow-2xl relative mb-8" style={{ border: 'none' }}>
                  <div className="bg-gradient-to-br from-purple-600 to-purple-900 p-6 text-center text-white relative">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-5 rounded-full -mr-10 -mt-10"></div>
                    <p className="text-xs uppercase tracking-widest opacity-80 mb-1">E-Ticket / ใบยืนยันคิว</p>
                    <h3 className="text-xl font-bold">{selectedServiceObj.name}</h3>
                  </div>
                  
                  <div className="border-t-2 border-dashed border-gray-300 ticket-cutout" style={{ borderColor: 'var(--border-glass)' }}></div>

                  <div className="p-6 relative z-10" style={{ background: isDarkMode ? '#1e1b2e' : '#ffffff' }}>
                    <div className="flex justify-between items-center mb-6">
                      <div><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>วันที่นัดหมาย (Date)</p><p className="font-bold text-lg" style={{ color: 'var(--text-main)' }}>{formData.date}</p></div>
                      <div className="text-right"><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>เวลา (Time)</p><p className="font-bold text-lg" style={{ color: 'var(--text-heading)' }}>{formData.time} น.</p></div>
                    </div>

                    <div className="flex justify-between items-center mb-6">
                      <div><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>ชื่อลูกค้า (Name)</p><p className="font-bold text-sm" style={{ color: 'var(--text-main)' }}>{userProfile.name}</p></div>
                      <div className="text-right"><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>จำนวน (Pax)</p><p className="font-bold text-sm" style={{ color: 'var(--text-main)' }}>{formData.pax} ท่าน</p></div>
                    </div>
                    
                    <div className="bg-gray-50 p-4 rounded-2xl flex items-center justify-between" style={{ background: 'var(--bg-input)' }}>
                      <div><p className="text-[10px] uppercase font-bold" style={{ color: 'var(--text-muted)' }}>Booking Ref.</p><p className="font-mono font-bold text-lg" style={{ color: 'var(--text-heading)' }}>{bookingRef}</p></div>
                      <Icon name="ticket" className="w-8 h-8 opacity-20" style={{ color: 'var(--text-heading)' }} />
                    </div>
                  </div>
                </div>

                <div className="flex gap-3 w-full max-w-sm">
                  <button onClick={() => window.print()} className="flex-1 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition-colors" style={{ background: 'var(--bg-input)', border: '1px solid var(--border-glass)', color: 'var(--text-main)' }}><Icon name="download" className="w-5 h-5" /> บันทึกรูป</button>
                  <button onClick={() => setStep('BOOKING')} className="flex-1 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition-colors bg-purple-100 text-purple-700 hover:bg-purple-200"><Icon name="home" className="w-5 h-5" /> หน้าหลัก</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
