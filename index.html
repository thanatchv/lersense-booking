<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Lersense Booking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="m-0 p-0">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { createClient } = supabase;

    // 🔴 1. ตั้งค่า Supabase 🔴
    const SUPABASE_URL = 'https://fbbyvdejhivrdedggtkt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYnl2ZGVqaGl2cmRlZGdndGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjYxMjIsImV4cCI6MjA5NjYwMjEyMn0.27i1ZEBIkpYsCAwTakNpjSmP4dRO9l53wSG5xSnRyfA';
    const isConfigured = !SUPABASE_URL.includes('วาง_');
    const supabaseClient = isConfigured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // 🔴 2. ตั้งค่า LIFF ID และเบอร์พร้อมเพย์รับเงิน 🔴
    const LIFF_ID = '2008899579-4H1nxNds'; 
    const PROMPTPAY_ID = '0812345678'; // 👈 เปลี่ยนเป็นเบอร์พร้อมเพย์ของร้านได้เลยครับ

    const Icon = ({ name, className }) => <i data-lucide={name} className={className}></i>;

    const MOCK_STAFF = [
      { id: 'random', name: '✨ สุ่มพนักงานที่เหมาะสม' },
      { id: 'ST1', name: 'หมอเอ (เชี่ยวชาญนวดไทย)' },
      { id: 'ST2', name: 'หมอบี (เชี่ยวชาญอโรม่า)' },
    ];

    function App() {
      const [step, setStep] = useState('LOGIN'); 
      const [loading, setLoading] = useState(true); 
      const [loadingText, setLoadingText] = useState('กำลังดำเนินการ...'); // เพิ่มข้อความ Loading ให้ดูสมจริง
      const [modal, setModal] = useState({ isOpen: false, title: '', message: '' });
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [dbError, setDbError] = useState(false);

      const [servicesData, setServicesData] = useState([]);
      const [branchesData, setBranchesData] = useState([]);
      const [userProfile, setUserProfile] = useState(null);
      const [lineProfile, setLineProfile] = useState(null);

      const [formData, setFormData] = useState({
        firstName: '', lastName: '', email: '', phone: '', dob: '', address: '',
        serviceId: '', locationId: '', staffId: 'random', pax: '1', date: '', time: '',
        healthRisks: { pregnant: false, highBp: false, surgery: false },
        equipments: { mat: false, towel: false },
        pdpaConsent: false
      });

      const [endTime, setEndTime] = useState('ยังไม่ได้เลือก');
      const [bookingRef, setBookingRef] = useState('');
      const [paymentMethod, setPaymentMethod] = useState('promptpay');
      const [timeLeft, setTimeLeft] = useState(900);
      
      // State สำหรับระบบชำระเงิน
      const [slipImage, setSlipImage] = useState(null); // พรีวิวรูปสลิป
      const fileInputRef = useRef(null);
      const [ccData, setCcData] = useState({ number: '', expiry: '', cvv: '' });

      const today = new Date().toISOString().split('T')[0];

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) setIsDarkMode(true);
        fetchSupabaseData();
        initializeApp();
      }, []);

      useEffect(() => {
        let timerId;
        if (step === 'PAYMENT' && timeLeft > 0) {
          timerId = setInterval(() => {
            setTimeLeft(prev => prev - 1);
          }, 1000);
        } else if (step === 'PAYMENT' && timeLeft <= 0) {
          setModal({ isOpen: true, title: 'หมดเวลาชำระเงิน', message: 'คิวที่ท่านเลือกถูกยกเลิกเนื่องจากหมดเวลาทำรายการ กรุณาทำการจองใหม่อีกครั้งครับ' });
          setStep('BOOKING');
        }
        return () => { if (timerId) clearInterval(timerId); };
      }, [step, timeLeft]);

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60).toString().padStart(2, '0');
        const s = (seconds % 60).toString().padStart(2, '0');
        return `${m}:${s}`;
      };

      const initializeApp = async () => {
        if (LIFF_ID.includes('วาง_') || !isConfigured) {
          setLoading(false);
          return;
        }
        try {
          await liff.init({ liffId: LIFF_ID });
          if (liff.isLoggedIn()) handleLiffLoginSuccess();
          else setLoading(false);
        } catch (err) {
          console.error('LIFF Init Error:', err);
          setModal({ isOpen: true, title: 'ข้อผิดพลาดระบบ', message: 'ไม่สามารถเชื่อมต่อ LINE ได้' });
          setLoading(false);
        }
      };

      const toggleTheme = () => setIsDarkMode(!isDarkMode);

      const handleLiffLoginSuccess = async () => {
        setLoading(true);
        try {
          const profile = await liff.getProfile(); 
          const lineUserId = profile.userId; 

          const { data: existingUser } = await supabaseClient.from('profiles').select('*').eq('line_user_id', lineUserId).maybeSingle();

          if (existingUser) {
            setUserProfile({ id: existingUser.id, name: `${existingUser.first_name} ${existingUser.last_name}`, phone: existingUser.phone, tier: existingUser.tier });
            setStep('BOOKING');
          } else {
            setLineProfile({ displayName: profile.displayName, pictureUrl: profile.pictureUrl, userId: lineUserId });
            setStep('REGISTER');
          }
        } catch (err) {
          console.error("Login Check Error:", err);
        }
        setLoading(false);
      };

      const handleLoginButton = () => {
        if (LIFF_ID.includes('วาง_')) {
          setLoading(true);
          setTimeout(() => {
            setLoading(false);
            setLineProfile({ displayName: 'สมหญิง รักสปา', pictureUrl: 'https://ui-avatars.com/api/?name=Somying+R&background=00c300&color=fff&size=150', userId: 'U123456789mock' });
            setFormData(prev => ({ ...prev, firstName: 'สมหญิง', lastName: 'รักสปา' }));
            setStep('REGISTER');
          }, 800);
        } else {
          liff.login(); 
        }
      };

      const handleRegister = async (e) => {
        e.preventDefault();
        setLoading(true);
        setLoadingText('กำลังสร้างบัญชีสมาชิก...');
        let currentUserId = 'MOCK_USER_ID';

        if (supabaseClient && lineProfile) {
          try {
            const { data, error } = await supabaseClient.from('profiles').insert([{
              line_user_id: lineProfile.userId, 
              first_name: formData.firstName,
              last_name: formData.lastName,
              email: formData.email,
              phone: formData.phone,
              dob: formData.dob,
              address: formData.address,
              pdpa_consented: formData.pdpaConsent,
              tier: 'Classic'
            }]).select();
            if (error) throw error;
            if (data && data[0]) currentUserId = data[0].id;
          } catch (err) {
            console.error("Register Error:", err);
            setModal({ isOpen: true, title: 'สมัครสมาชิกไม่สำเร็จ', message: err.message });
            setLoading(false);
            return;
          }
        }

        setTimeout(() => {
          setLoading(false);
          setUserProfile({ id: currentUserId, name: `${formData.firstName} ${formData.lastName}`, phone: formData.phone, tier: 'Classic Member', points: 0 });
          setStep('BOOKING');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 800);
      };

      const fetchSupabaseData = async () => {
        if (!supabaseClient) {
          setServicesData([
            { id: 'S1', name: '[จำลอง] นวดไทย', duration_minutes: 60, price: 500, deposit_amount: 200 },
            { id: 'S2', name: '[จำลอง] นวดอโรม่า', duration_minutes: 90, price: 1200, deposit_amount: 500 }
          ]);
          setBranchesData([
            { id: 'L1', name: '[จำลอง] สาขาหลัก', type: 'in_store' },
            { id: 'L2', name: '[จำลอง] นอกสถานที่ (Delivery)', type: 'off_site' }
          ]);
          return;
        }

        try {
          const { data: sData, error: sError } = await supabaseClient.from('services').select('*').eq('is_active', true);
          const { data: bData, error: bError } = await supabaseClient.from('branches').select('*').eq('is_active', true);
          if (sError || bError) throw (sError || bError);
          
          if (sData && sData.length > 0) { setServicesData(sData); setDbError(false); } else { setDbError(true); }
          if (bData && bData.length > 0) setBranchesData(bData);
        } catch (err) {
          console.error("Fetch Error: ", err);
          setDbError(true);
        }
      };

      const handleChange = (e) => {
        const { name, value, type, checked } = e.target;
        if (name.startsWith('health_')) {
          setFormData(prev => ({ ...prev, healthRisks: { ...prev.healthRisks, [name.replace('health_', '')]: checked } }));
        } else if (name.startsWith('equip_')) {
          setFormData(prev => ({ ...prev, equipments: { ...prev.equipments, [name.replace('equip_', '')]: checked } }));
        } else if (type === 'checkbox') {
          setFormData(prev => ({ ...prev, [name]: checked }));
        } else {
          setFormData(prev => ({ ...prev, [name]: value }));
        }
      };

      useEffect(() => {
        if (formData.serviceId && formData.time && servicesData.length > 0) {
          const service = servicesData.find(s => s.id === formData.serviceId);
          if (service) {
            const [hours, minutes] = formData.time.split(':').map(Number);
            const dateObj = new Date();
            dateObj.setHours(hours, minutes + service.duration_minutes);
            const endH = String(dateObj.getHours()).padStart(2, '0');
            const endM = String(dateObj.getMinutes()).padStart(2, '0');
            setEndTime(`ใช้เวลา ${service.duration_minutes} นาที • เสร็จประมาณ ${endH}:${endM} น.`);
          }
        } else { setEndTime('กรุณาเลือกบริการและเวลา'); }
      }, [formData.serviceId, formData.time, servicesData]);

      const isOffSite = branchesData.find(b => b.id === formData.locationId)?.type === 'off_site';

      const handleBookingSubmit = async (e) => {
        e.preventDefault();
        const { pregnant, highBp, surgery } = formData.healthRisks;
        if (pregnant || highBp || surgery) {
          setModal({ isOpen: true, title: 'ไม่สามารถทำรายการได้อัตโนมัติ', message: 'ท่านมีปัญหาสุขภาพที่อยู่ในกลุ่มเสี่ยง กรุณาติดต่อแอดมินผ่านแชทเพื่อประเมินการรับบริการเพื่อความปลอดภัยครับ' });
          return;
        }

        setLoading(true);
        setLoadingText('กำลังสร้างข้อมูลการจอง...');
        const newBookingRef = `BK-${new Date().getTime().toString().slice(-6)}`; 
        setBookingRef(newBookingRef);

        if (supabaseClient) {
          try {
            const selectedService = servicesData.find(s => s.id === formData.serviceId) || { price: 0 };
            const { error } = await supabaseClient.from('bookings').insert([{
                booking_ref: newBookingRef,
                customer_id: userProfile.id, 
                service_id: formData.serviceId,
                branch_id: formData.locationId, 
                booking_date: formData.date,
                start_time: formData.time + ":00", 
                end_time: formData.time + ":00", 
                buffer_end_time: formData.time + ":00",
                total_price: selectedService.price * parseInt(formData.pax),
                deposit_paid: 0,
                health_risks: formData.healthRisks,
                equipments: isOffSite ? formData.equipments : null,
                status: 'pending_payment'
            }]);
            if (error) throw error;
          } catch (err) {
            console.error("Insert Booking Error: ", err);
            setModal({ isOpen: true, title: 'ข้อผิดพลาด', message: 'ไม่สามารถบันทึกการจองได้: ' + err.message });
            setLoading(false);
            return;
          }
        }

        setTimeout(() => {
          setLoading(false);
          setTimeLeft(900);
          setSlipImage(null); // ล้างสลิปเก่า
          setCcData({ number: '', expiry: '', cvv: '' });
          setStep('PAYMENT');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 800);
      };

      // --- 🟢 ฟังก์ชันจัดการไฟล์สลิป ---
      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setSlipImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      // --- 🟢 ฟังก์ชันตรวจสอบแบบฟอร์มชำระเงินและกดยืนยัน ---
      const handlePaymentSuccess = async () => {
        // Validation ฝั่ง Frontend
        if (paymentMethod === 'promptpay' && !slipImage) {
          setModal({ isOpen: true, title: 'กรุณาอัปโหลดสลิป', message: 'โปรดแนบรูปภาพสลิปโอนเงินเพื่อยืนยันการชำระเงินมัดจำครับ' });
          return;
        }
        if (paymentMethod === 'creditcard') {
          if (ccData.number.length < 16 || ccData.expiry.length < 5 || ccData.cvv.length < 3) {
            setModal({ isOpen: true, title: 'ข้อมูลไม่ครบถ้วน', message: 'กรุณากรอกข้อมูลบัตรเครดิตให้ครบถ้วนเพื่อทำการชำระเงิน' });
            return;
          }
        }

        setLoading(true);
        setLoadingText(paymentMethod === 'promptpay' ? 'กำลังตรวจสอบสลิปโอนเงิน...' : 'กำลังตัดวงเงินบัตรเครดิต...');

        if (supabaseClient) {
          try {
            const selectedService = servicesData.find(s => s.id === formData.serviceId) || {};
            const depositAmount = (selectedService.deposit_amount || 200) * parseInt(formData.pax);

            // อัปเดตสถานะ (ถ้าเป็น promptpay ในระบบจริงอาจจะปรับเป็น 'verifying' ให้แอดมินดูก่อน)
            // แต่สำหรับ MVP นี้ เราจะปรับเป็น 'confirmed' เลยเพื่อให้ลูกค้าได้ E-Ticket ทันที
            const { error } = await supabaseClient
              .from('bookings')
              .update({ 
                status: 'confirmed', 
                deposit_paid: depositAmount, 
                payment_status: 'deposit_paid' 
                // หมายเหตุ: ถ้าระบบจริงต้องอัปโหลดสลิปรูปเข้า Storage แล้วเอา URL มาเซฟใน Database ด้วย
              })
              .eq('booking_ref', bookingRef);
            if (error) throw error;
          } catch (err) {
            console.error("Update Payment Error:", err);
          }
        }
        
        setTimeout(() => {
          setLoading(false);
          setStep('TICKET');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 2000); // ดีเลย์ 2 วิให้ดูสมจริงว่ากำลังประมวลผล
      };

      const selectedServiceObj = servicesData.find(s => s.id === formData.serviceId) || {};
      const paxCount = parseInt(formData.pax) || 1;
      const depositTotal = (selectedServiceObj.deposit_amount || 200) * paxCount;
      
      // สร้าง URL สำหรับดึงรูป QR Code พร้อมเพย์จริง (ระบบ Promptpay.io)
      const qrCodeUrl = `https://promptpay.io/${PROMPTPAY_ID}/${depositTotal}.png`;

      return (
        <div className={`min-h-screen pb-32 transition-colors duration-500 app-container ${isDarkMode ? 'dark' : 'light'}`}>
          <style>{`
            .app-container {
              font-family: 'Noto Sans Thai', sans-serif;
              color-scheme: light;
              --bg-gradient:
                radial-gradient(circle at 12% 8%, rgba(120,170,255,0.30), transparent 32%),
                radial-gradient(circle at 88% 6%, rgba(255,190,120,0.22), transparent 30%),
                radial-gradient(circle at 92% 92%, rgba(160,120,255,0.24), transparent 32%),
                radial-gradient(circle at 8% 88%, rgba(120,240,220,0.18), transparent 30%),
                linear-gradient(180deg, #eef3fb 0%, #e9edf7 45%, #e4e9f5 100%);
              --text-main: #10131a;
              --text-muted: #5b6272;
              --text-heading: #1c2340;
              --bg-glass: linear-gradient(155deg, rgba(255,255,255,0.62) 0%, rgba(255,255,255,0.22) 55%, rgba(255,255,255,0.38) 100%);
              --border-glass: rgba(255,255,255,0.65);
              --border-glass-soft: rgba(255,255,255,0.35);
              --bg-input: rgba(255,255,255,0.38);
              --border-input: rgba(255,255,255,0.55);
              --bg-input-focus: rgba(255,255,255,0.62);
              --bg-element: rgba(255,255,255,0.30);
              --shadow-ambient: 0 30px 70px rgba(30,40,80,0.16), 0 2px 8px rgba(30,40,80,0.06);
              --shadow-ambient-sm: 0 12px 30px rgba(30,40,80,0.12);
              --specular: rgba(255,255,255,0.9);
              --accent-a: 120,170,255;
              --accent-b: 160,120,255;
            }
            .app-container.dark {
              color-scheme: dark;
              --bg-gradient:
                radial-gradient(circle at 12% 8%, rgba(90,130,255,0.20), transparent 32%),
                radial-gradient(circle at 88% 6%, rgba(255,170,110,0.14), transparent 30%),
                radial-gradient(circle at 92% 92%, rgba(150,100,255,0.18), transparent 32%),
                radial-gradient(circle at 8% 88%, rgba(90,220,200,0.12), transparent 30%),
                linear-gradient(180deg, #0a0c14 0%, #0d0f1a 45%, #0b0d16 100%);
              --text-main: #eef1f8;
              --text-muted: #9198ab;
              --text-heading: #cdd6ff;
              --bg-glass: linear-gradient(155deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 55%, rgba(255,255,255,0.06) 100%);
              --border-glass: rgba(255,255,255,0.14);
              --border-glass-soft: rgba(255,255,255,0.06);
              --bg-input: rgba(255,255,255,0.05);
              --border-input: rgba(255,255,255,0.10);
              --bg-input-focus: rgba(255,255,255,0.09);
              --bg-element: rgba(255,255,255,0.045);
              --shadow-ambient: 0 30px 70px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.3);
              --shadow-ambient-sm: 0 12px 30px rgba(0,0,0,0.4);
              --specular: rgba(255,255,255,0.18);
              --accent-a: 110,150,255;
              --accent-b: 170,130,255;
            }
            .app-container { background: var(--bg-gradient); color: var(--text-main); background-attachment: fixed; }

            @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(4%,6%) scale(1.08); } }
            @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-5%,-4%) scale(1.06); } }
            .liquid-blob { position: fixed; border-radius: 50%; filter: blur(60px); pointer-events: none; z-index: 0; opacity: 0.8; }
            @media (prefers-reduced-motion: no-preference) {
              .liquid-blob.b1 { animation: drift1 22s ease-in-out infinite; }
              .liquid-blob.b2 { animation: drift2 26s ease-in-out infinite; }
            }

            /* ===== Core glass surface ===== */
            .glass-panel {
              position: relative;
              background: var(--bg-glass);
              border: 1px solid var(--border-glass);
              box-shadow: var(--shadow-ambient), inset 0 1px 0 var(--specular), inset 0 -12px 24px -20px rgba(0,0,0,0.25);
              backdrop-filter: blur(28px) saturate(180%);
              -webkit-backdrop-filter: blur(28px) saturate(180%);
              transition: box-shadow .35s ease, transform .35s ease, background .35s ease;
              isolation: isolate;
            }
            .glass-panel::before {
              content: '';
              position: absolute; inset: 0;
              border-radius: inherit;
              padding: 1px;
              background: linear-gradient(155deg, rgba(255,255,255,0.85), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.35));
              -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
              -webkit-mask-composite: xor; mask-composite: exclude;
              opacity: 0.9; pointer-events: none;
            }
            .app-container.dark .glass-panel::before { background: linear-gradient(155deg, rgba(255,255,255,0.22), rgba(255,255,255,0) 30%, rgba(255,255,255,0) 70%, rgba(255,255,255,0.06)); }

            .input-shell {
              position: relative;
              background: var(--bg-input);
              border: 1px solid var(--border-input);
              box-shadow: inset 0 1px 1px var(--specular), inset 0 -1px 6px rgba(0,0,0,0.03);
              backdrop-filter: blur(16px) saturate(160%);
              -webkit-backdrop-filter: blur(16px) saturate(160%);
              transition: 0.22s ease;
            }
            .input-shell:focus-within {
              transform: translateY(-1px);
              border-color: rgba(var(--accent-a),0.55);

            .spinner-glass { border-radius: 50%; border: 3px solid rgba(var(--accent-a),0.18); border-top-color: rgb(var(--accent-b)); animation: spin-glass .9s linear infinite; }
          `}</style>

                </div>

                <div className={`mx-auto mb-6 px-4 py-2.5 rounded-full flex items-center justify-center gap-2 w-fit font-bold text-sm badge-chip glass-panel ${timeLeft < 300 ? 'animate-pulse' : ''}`} style={{ color: timeLeft < 300 ? '#e11d48' : 'var(--text-heading)' }}>
                  <Icon name="clock" className="w-4 h-4" /> 
                  เวลาที่เหลือ {formatTime(timeLeft)} นาที
                </div>

                <div className="glass-panel rounded-[28px] p-6 mb-6 text-center">
                  <p className="text-sm mb-1" style={{ color: 'var(--text-muted)' }}>ยอดมัดจำสุทธิ</p>
                  <h3 className="text-5xl font-bold mb-2" style={{ color: 'var(--text-heading)' }}>฿{depositTotal.toLocaleString()}</h3>
                  <p className="text-xs" style={{ color: 'var(--text-muted)' }}>({selectedServiceObj.name} x {formData.pax} ท่าน)</p>
                </div>

                <div className="glass-panel rounded-[28px] p-5 mb-8">
                  <h3 className="font-semibold mb-4 text-sm" style={{ color: 'var(--text-heading)' }}>ช่องทางชำระเงิน</h3>
                  <div className="flex gap-3 mb-6">
                    <button onClick={() => setPaymentMethod('promptpay')} className="flex-1 py-3 rounded-2xl flex flex-col items-center gap-2 border-2 transition-all" style={{ borderColor: paymentMethod === 'promptpay' ? 'rgb(var(--accent-b))' : 'transparent', background: paymentMethod === 'promptpay' ? 'rgba(var(--accent-b),0.10)' : 'var(--bg-input)' }}>
                      <Icon name="qr-code" className="w-6 h-6" style={{ color: paymentMethod === 'promptpay' ? 'rgb(var(--accent-b))' : 'var(--text-muted)' }} />
                      <span className="text-xs font-bold" style={{ color: paymentMethod === 'promptpay' ? 'rgb(var(--accent-b))' : 'var(--text-muted)' }}>โอนเงิน (สลิป)</span>
                    </button>
                    <button onClick={() => setPaymentMethod('creditcard')} className="flex-1 py-3 rounded-2xl flex flex-col items-center gap-2 border-2 transition-all" style={{ borderColor: paymentMethod === 'creditcard' ? 'rgb(var(--accent-b))' : 'transparent', background: paymentMethod === 'creditcard' ? 'rgba(var(--accent-b),0.10)' : 'var(--bg-input)' }}>
                      <Icon name="credit-card" className="w-6 h-6" style={{ color: paymentMethod === 'creditcard' ? 'rgb(var(--accent-b))' : 'var(--text-muted)' }} />
                      <span className="text-xs font-bold" style={{ color: paymentMethod === 'creditcard' ? 'rgb(var(--accent-b))' : 'var(--text-muted)' }}>บัตรเครดิต</span>
                    </button>
                  </div>

                  {/* PromptPay & Slip Upload Flow */}
                  {paymentMethod === 'promptpay' && (
                    <div className="animate-fade-in">
                      <div className="text-center mb-6">
                        <div className="w-56 h-56 mx-auto bg-white p-3 rounded-[24px] mb-4 relative" style={{ boxShadow: 'var(--shadow-ambient-sm)', border: '1px solid rgba(255,255,255,0.8)' }}>
                          <img src={qrCodeUrl} alt="PromptPay QR Code" className="w-full h-full object-contain" />
                          <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-white rounded-full p-1">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/PromptPay-logo.png/1200px-PromptPay-logo.png" className="w-8 h-8 object-contain" alt="PromptPay" />
                          </div>
                        </div>
                        <p className="text-sm font-semibold" style={{ color: 'var(--text-main)' }}>บริษัท เลอเซนส์ สปา จำกัด</p>
                        <p className="text-xs" style={{ color: 'var(--text-muted)' }}>พร้อมเพย์: {PROMPTPAY_ID}</p>
                      </div>

                      <div className="border-t pt-5 mb-2" style={{ borderColor: 'var(--border-glass)' }}>
                        <h4 className="text-sm font-semibold mb-3 flex items-center gap-2" style={{ color: 'var(--text-heading)' }}><Icon name="image" className="w-4 h-4" /> อัปโหลดหลักฐานการโอนเงิน</h4>
                        
                        <input type="file" accept="image/*" className="hidden" ref={fileInputRef} onChange={handleFileChange} />
                        
                        {!slipImage ? (
                          <div onClick={() => fileInputRef.current.click()} className="file-upload-zone rounded-[20px] p-6 flex flex-col items-center justify-center gap-2">
                            <div className="w-12 h-12 rounded-full flex items-center justify-center" style={{ background: 'rgba(var(--accent-b),0.14)', color: 'rgb(var(--accent-b))' }}><Icon name="upload-cloud" className="w-6 h-6" /></div>
                            <p className="text-sm font-bold" style={{ color: 'var(--text-heading)' }}>แตะเพื่อเลือกรูปสลิป</p>
                            <p className="text-xs" style={{ color: 'var(--text-muted)' }}>รองรับ .jpg, .png</p>
                          </div>
                        ) : (
                          <div className="relative rounded-[20px] overflow-hidden" style={{ border: '1px solid rgba(var(--accent-b),0.35)' }}>
                            <img src={slipImage} alt="Slip Preview" className="w-full h-48 object-cover opacity-80" />
                            <div className="absolute inset-0 bg-black/40 flex flex-col items-center justify-center">
                               <Icon name="check-circle" className="w-10 h-10 text-green-400 mb-2" />
                               <span className="text-white font-bold text-sm">อัปโหลดสำเร็จ</span>
                               <button onClick={() => setSlipImage(null)} className="mt-3 text-xs bg-white/20 text-white px-3 py-1.5 rounded-full hover:bg-white/30 backdrop-blur-sm">เปลี่ยนรูปภาพ</button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  )}

                  {/* Credit Card Form */}
                  {paymentMethod === 'creditcard' && (
                    <div className="animate-fade-in flex flex-col gap-3 mb-4">
                      <div className="input-shell rounded-2xl flex items-center pl-3 relative">
                        <Icon name="credit-card" className="w-5 h-5 opacity-50" style={{ color: 'var(--text-main)' }} />
                        <input type="tel" maxLength="16" placeholder="หมายเลขบัตรเครดิต 16 หลัก" className="form-element pl-2" value={ccData.number} onChange={e => setCcData({...ccData, number: e.target.value.replace(/\D/g,'')})} />
                        {ccData.number.length === 16 && <Icon name="check-circle" className="w-4 h-4 text-green-500 absolute right-4" />}
                      </div>
                      <div className="grid grid-cols-2 gap-3">
                        <div className="input-shell rounded-2xl flex items-center px-3"><input type="text" maxLength="5" placeholder="MM/YY" className="form-element px-0 text-center" value={ccData.expiry} onChange={e => setCcData({...ccData, expiry: e.target.value})} /></div>
                        <div className="input-shell rounded-2xl flex items-center px-3"><input type="tel" maxLength="3" placeholder="CVV" className="form-element px-0 text-center" value={ccData.cvv} onChange={e => setCcData({...ccData, cvv: e.target.value.replace(/\D/g,'')})} /></div>
                      </div>
                      <p className="text-[10px] text-center mt-2 flex items-center justify-center gap-1" style={{ color: 'var(--text-muted)' }}><Icon name="lock" className="w-3 h-3" /> ข้อมูลของท่านถูกเข้ารหัสอย่างปลอดภัย</p>
                    </div>
                  )}

                  <button onClick={handlePaymentSuccess} className="w-full btn-gold py-4 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2 mt-4">
                    {paymentMethod === 'promptpay' ? 'ยืนยันการชำระเงิน' : `ชำระ ฿${depositTotal.toLocaleString()}`}
                  </button>
                </div>
              </div>
            )}

            {/* TICKET STEP */}
            {step === 'TICKET' && (
              <div className="animate-fade-in flex flex-col items-center pt-4">
                <h2 className="text-2xl font-bold mb-6 flex items-center gap-2" style={{ color: '#059669' }}><Icon name="check-circle" className="w-8 h-8" /> ชำระเงินสำเร็จ</h2>
                <div className="w-full max-w-sm glass-panel rounded-[32px] overflow-hidden relative mb-8">
                  <div className="p-6 text-center text-white relative" style={{ background: 'linear-gradient(135deg, rgb(var(--accent-a)), rgb(var(--accent-b)))' }}>
                    <div className="absolute top-0 right-0 w-32 h-32 bg-white opacity-10 rounded-full -mr-10 -mt-10"></div>
                    <p className="text-xs uppercase tracking-widest opacity-80 mb-1">E-Ticket / ใบยืนยันคิว</p>
                    <h3 className="text-xl font-bold">{selectedServiceObj.name}</h3>
                  </div>
                  <div className="border-t-2 border-dashed ticket-cutout" style={{ borderColor: 'var(--border-glass)' }}></div>
                  <div className="p-6 relative z-10">
                    <div className="flex justify-between items-center mb-6">
                      <div><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>วันที่นัดหมาย</p><p className="font-bold text-lg" style={{ color: 'var(--text-main)' }}>{formData.date}</p></div>
                      <div className="text-right"><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>เวลา</p><p className="font-bold text-lg" style={{ color: 'var(--text-heading)' }}>{formData.time} น.</p></div>
                    </div>
                    <div className="flex justify-between items-center mb-6">
                      <div><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>ชื่อลูกค้า</p><p className="font-bold text-sm" style={{ color: 'var(--text-main)' }}>{userProfile.name}</p></div>
                      <div className="text-right"><p className="text-[10px]" style={{ color: 'var(--text-muted)' }}>จำนวน</p><p className="font-bold text-sm" style={{ color: 'var(--text-main)' }}>{formData.pax} ท่าน</p></div>
                    </div>
                    <div className="p-4 rounded-2xl flex items-center justify-between" style={{ background: 'var(--bg-element)', border: '1px solid var(--border-glass)' }}>
                      <div><p className="text-[10px] uppercase font-bold" style={{ color: 'var(--text-muted)' }}>Booking Ref.</p><p className="font-mono font-bold text-lg" style={{ color: 'var(--text-heading)' }}>{bookingRef}</p></div>
                      <Icon name="ticket" className="w-8 h-8 opacity-20" style={{ color: 'var(--text-heading)' }} />
                    </div>
                  </div>
                </div>
                <div className="flex gap-3 w-full max-w-sm">
                  <button onClick={() => window.print()} className="flex-1 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition-colors btn-ghost" style={{ color: 'var(--text-main)' }}><Icon name="download" className="w-5 h-5" /> บันทึกรูป</button>
                  <button onClick={() => setStep('BOOKING')} className="flex-1 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition-colors" style={{ background: 'rgba(var(--accent-b),0.14)', color: 'rgb(var(--accent-b))' }}><Icon name="home" className="w-5 h-5" /> หน้าหลัก</button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
