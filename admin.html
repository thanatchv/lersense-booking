<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Lersense Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body { font-family: 'Noto Sans Thai', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; }
    .glass-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 4px 24px rgba(0, 0, 0, 0.02); backdrop-filter: blur(12px); border-radius: 20px; }
    .sidebar-item { transition: all 0.2s ease; }
    .sidebar-item:hover, .sidebar-item.active { background: #f3e8ff; color: #7e22ce; font-weight: 600; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createClient } = supabase;

    // 🔴 นำ API Key และ URL จาก Supabase มาใส่ตรงนี้ 🔴
    const SUPABASE_URL = 'https://fbbyvdejhivrdedggtkt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZiYnl2ZGVqaGl2cmRlZGdndGt0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMjYxMjIsImV4cCI6MjA5NjYwMjEyMn0.27i1ZEBIkpYsCAwTakNpjSmP4dRO9l53wSG5xSnRyfA';

    const isConfigured = !SUPABASE_URL.includes('วาง_');
    const supabaseClient = isConfigured ? createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const Icon = ({ name, className }) => <i data-lucide={name} className={className}></i>;

    function AdminApp() {
      const [bookings, setBookings] = useState([]);
      const [loading, setLoading] = useState(true);
      const [activeMenu, setActiveMenu] = useState('dashboard');

      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      });

      useEffect(() => {
        fetchBookings();
      }, []);

      const fetchBookings = async () => {
        setLoading(true);
        if (!supabaseClient) {
          // ข้อมูลจำลองกรณีไม่ได้ใส่ Key
          setTimeout(() => {
            setBookings([
              { id: '1', booking_ref: 'BK-178103', booking_date: '2026-06-15', start_time: '14:00', total_price: 1200, status: 'confirmed', service_name: 'นวดน้ำมันอโรม่า', customer_name: 'ธนัช จ.' },
              { id: '2', booking_ref: 'BK-178104', booking_date: '2026-06-15', start_time: '16:30', total_price: 500, status: 'pending_payment', service_name: 'นวดไทยโบราณ', customer_name: 'สมชาย ด.' },
            ]);
            setLoading(false);
          }, 800);
          return;
        }

        try {
          // ดึงข้อมูลการจอง (ในระบบจริงจะมีการ JOIN ตาราง profiles และ services)
          const { data, error } = await supabaseClient
            .from('bookings')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(10);

          if (error) throw error;
          
          // Map ข้อมูลเบื้องต้นเพื่อโชว์ในตาราง
          const formattedData = data.map(b => ({
            ...b,
            customer_name: 'ลูกค้า (รอโหลดชื่อ)', // อนาคตจะ JOIN ดึงชื่อมา
            service_name: 'บริการ (รอโหลดชื่อ)'
          }));
          setBookings(formattedData);
        } catch (err) {
          console.error("Fetch Bookings Error:", err);
        } finally {
          setLoading(false);
        }
      };

      const getStatusBadge = (status) => {
        switch(status) {
          case 'confirmed': return <span className="px-3 py-1 rounded-full text-xs font-bold bg-green-100 text-green-700">ยืนยันแล้ว</span>;
          case 'pending_payment': return <span className="px-3 py-1 rounded-full text-xs font-bold bg-yellow-100 text-yellow-700">รอมัดจำ</span>;
          case 'completed': return <span className="px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-700">เสร็จสิ้น</span>;
          default: return <span className="px-3 py-1 rounded-full text-xs font-bold bg-purple-100 text-purple-700">{status}</span>;
        }
      };

      return (
        <div className="flex h-screen overflow-hidden">
          
          {/* --- Sidebar (เมนูด้านซ้าย) --- */}
          <aside className="w-64 bg-white border-r border-slate-200 flex flex-col">
            <div className="h-20 flex items-center px-6 border-b border-slate-100">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-purple-600 to-yellow-500 flex items-center justify-center text-white font-bold mr-3 shadow-md">L</div>
              <span className="font-bold text-xl tracking-tight text-slate-800">Lersense<span className="text-purple-600">Admin</span></span>
            </div>
            
            <nav className="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
              <a href="#" onClick={() => setActiveMenu('dashboard')} className={`sidebar-item flex items-center px-4 py-3 text-sm text-slate-600 ${activeMenu === 'dashboard' ? 'active' : ''}`}>
                <Icon name="layout-dashboard" className="w-5 h-5 mr-3" /> แดชบอร์ด (ภาพรวม)
              </a>
              <a href="#" onClick={() => setActiveMenu('bookings')} className={`sidebar-item flex items-center px-4 py-3 text-sm text-slate-600 ${activeMenu === 'bookings' ? 'active' : ''}`}>
                <Icon name="calendar-days" className="w-5 h-5 mr-3" /> จัดการคิวงาน
              </a>
              <a href="#" onClick={() => setActiveMenu('customers')} className={`sidebar-item flex items-center px-4 py-3 text-sm text-slate-600 ${activeMenu === 'customers' ? 'active' : ''}`}>
                <Icon name="users" className="w-5 h-5 mr-3" /> ฐานข้อมูลลูกค้า
              </a>
              <a href="#" onClick={() => setActiveMenu('staff')} className={`sidebar-item flex items-center px-4 py-3 text-sm text-slate-600 ${activeMenu === 'staff' ? 'active' : ''}`}>
                <Icon name="contact" className="w-5 h-5 mr-3" /> พนักงานนวด
              </a>
              <a href="#" onClick={() => setActiveMenu('settings')} className={`sidebar-item flex items-center px-4 py-3 text-sm text-slate-600 ${activeMenu === 'settings' ? 'active' : ''}`}>
                <Icon name="settings" className="w-5 h-5 mr-3" /> ตั้งค่าระบบ
              </a>
            </nav>

            <div className="p-4 border-t border-slate-200">
              <div className="flex items-center px-4 py-2">
                <div className="w-8 h-8 rounded-full bg-slate-200 mr-3 overflow-hidden">
                  <img src="https://ui-avatars.com/api/?name=Admin&background=475569&color=fff" alt="Admin" />
                </div>
                <div>
                  <p className="text-sm font-bold text-slate-800">ผู้ดูแลระบบ</p>
                  <p className="text-xs text-slate-500">สาขาหลัก</p>
                </div>
              </div>
            </div>
          </aside>

          {/* --- Main Content (เนื้อหาหลัก) --- */}
          <main className="flex-1 overflow-y-auto bg-slate-50">
            <header className="h-20 bg-white/80 backdrop-blur-md border-b border-slate-200 flex items-center justify-between px-8 sticky top-0 z-10">
              <h1 className="text-2xl font-bold text-slate-800">
                {activeMenu === 'dashboard' && 'แดชบอร์ดภาพรวม'}
                {activeMenu === 'bookings' && 'จัดการคิวงาน (Bookings)'}
              </h1>
              <div className="flex items-center gap-4">
                <button className="p-2 text-slate-400 hover:text-purple-600 transition-colors"><Icon name="bell" className="w-5 h-5" /></button>
                <button onClick={fetchBookings} className="flex items-center gap-2 bg-purple-100 text-purple-700 px-4 py-2 rounded-xl text-sm font-semibold hover:bg-purple-200 transition-colors">
                  <Icon name="refresh-cw" className={`w-4 h-4 ${loading ? 'animate-spin' : ''}`} /> รีเฟรชข้อมูล
                </button>
              </div>
            </header>

            <div className="p-8 max-w-7xl mx-auto">
              
              {!isConfigured && (
                <div className="mb-6 p-4 bg-yellow-100 text-yellow-800 rounded-xl text-sm border border-yellow-200 flex items-start gap-3">
                  <Icon name="alert-triangle" className="w-5 h-5 flex-shrink-0 mt-0.5" />
                  <div>
                    <strong className="block mb-1">ทำงานในโหมดจำลอง (Mock Data)</strong>
                    คุณยังไม่ได้ใส่ API Key ของ Supabase ในไฟล์ admin.html โปรดใส่เพื่อให้ระบบดึงคิวงานจากฐานข้อมูลจริงมาแสดง
                  </div>
                </div>
              )}

              {/* Stat Cards */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div className="glass-card p-6 flex items-center">
                  <div className="w-14 h-14 rounded-2xl bg-purple-100 flex items-center justify-center text-purple-600 mr-4">
                    <Icon name="calendar-check" className="w-7 h-7" />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-500 mb-1">คิวงานวันนี้</p>
                    <h3 className="text-2xl font-bold text-slate-800">12 <span className="text-sm font-normal text-slate-500">คิว</span></h3>
                  </div>
                </div>
                <div className="glass-card p-6 flex items-center">
                  <div className="w-14 h-14 rounded-2xl bg-green-100 flex items-center justify-center text-green-600 mr-4">
                    <Icon name="banknote" className="w-7 h-7" />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-500 mb-1">รายได้คาดการณ์ (วันนี้)</p>
                    <h3 className="text-2xl font-bold text-slate-800">฿14,500</h3>
                  </div>
                </div>
                <div className="glass-card p-6 flex items-center">
                  <div className="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center text-blue-600 mr-4">
                    <Icon name="user-plus" className="w-7 h-7" />
                  </div>
                  <div>
                    <p className="text-sm font-semibold text-slate-500 mb-1">สมาชิกลงทะเบียนใหม่</p>
                    <h3 className="text-2xl font-bold text-slate-800">5 <span className="text-sm font-normal text-slate-500">คน</span></h3>
                  </div>
                </div>
              </div>

              {/* Booking Table */}
              <div className="glass-card overflow-hidden">
                <div className="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-white">
                  <h2 className="text-lg font-bold text-slate-800">รายการจองล่าสุด (Recent Bookings)</h2>
                  <button className="text-sm text-purple-600 font-semibold hover:underline">ดูทั้งหมด</button>
                </div>
                
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider">
                        <th className="px-6 py-4 font-semibold">รหัสอ้างอิง</th>
                        <th className="px-6 py-4 font-semibold">ลูกค้า</th>
                        <th className="px-6 py-4 font-semibold">บริการ</th>
                        <th className="px-6 py-4 font-semibold">วัน/เวลา</th>
                        <th className="px-6 py-4 font-semibold">ยอดรวม</th>
                        <th className="px-6 py-4 font-semibold">สถานะ</th>
                        <th className="px-6 py-4 font-semibold text-right">จัดการ</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 bg-white">
                      {loading ? (
                        <tr><td colSpan="7" className="px-6 py-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>
                      ) : bookings.length === 0 ? (
                        <tr><td colSpan="7" className="px-6 py-8 text-center text-slate-400">ยังไม่มีรายการจองในระบบ</td></tr>
                      ) : (
                        bookings.map((b, idx) => (
                          <tr key={idx} className="hover:bg-slate-50 transition-colors">
                            <td className="px-6 py-4 text-sm font-mono font-medium text-slate-600">{b.booking_ref}</td>
                            <td className="px-6 py-4 text-sm font-bold text-slate-800">{b.customer_name}</td>
                            <td className="px-6 py-4 text-sm text-slate-600">{b.service_name || 'N/A'}</td>
                            <td className="px-6 py-4 text-sm text-slate-600">
                              <div className="font-semibold">{b.booking_date}</div>
                              <div className="text-xs text-slate-400">{b.start_time?.substring(0,5)} น.</div>
                            </td>
                            <td className="px-6 py-4 text-sm font-bold text-slate-800">฿{b.total_price}</td>
                            <td className="px-6 py-4">{getStatusBadge(b.status)}</td>
                            <td className="px-6 py-4 text-right">
                              <button className="text-slate-400 hover:text-purple-600 transition-colors" title="ดูรายละเอียด">
                                <Icon name="more-horizontal" className="w-5 h-5 ml-auto" />
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<AdminApp />);
  </script>
</body>
</html>
